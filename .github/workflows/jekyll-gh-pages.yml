# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Test and Lint job
  # Runs on the macOS arm64 self-hosted runner registered to this repository
  # with the label donaldfilimoncom: GitHub-hosted jobs cannot start while the
  # account's Actions billing is locked, but self-hosted jobs still run. This
  # workflow has only trusted triggers (push to main, workflow_dispatch); the
  # gate below skips any other event, so a trigger added later cannot put
  # untrusted code on the self-hosted machine.
  # Until a runner with these labels is online, this job waits in the queue.
  # See docs/SelfHostedRunner.md.
  test_and_lint:
    if: >
      github.repository == 'donaldfilimon/donaldfilimoncom' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, donaldfilimoncom]
    # This job only reads the repository; drop the workflow's Pages scopes.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # actions/setup-python cannot be used here: on a self-hosted Mac it runs
      # `sudo installer -pkg` into /Library/Frameworks and needs a writable
      # /Users/runner/hostedtoolcache. Homebrew's current python@3.x is the
      # same "latest 3.x" that python-version '3.x' selected, installed per
      # user and without sudo. Its libexec/bin puts an unversioned `python`
      # on PATH for the unchanged steps below.
      - name: Set up Python
        run: |
          brew="$(command -v brew || echo /opt/homebrew/bin/brew)"
          if ! prefix="$("$brew" --prefix --installed python)"; then
            echo "::error::Homebrew python is not installed on this runner. Run: brew install python"
            exit 1
          fi
          echo "$prefix/libexec/bin" >> "$GITHUB_PATH"
          "$prefix/libexec/bin/python" --version
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run tests
        run: |
          source venv/bin/activate
          pytest
      - name: Run linting
        run: |
          source venv/bin/activate
          flake8 .

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test_and_lint]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
